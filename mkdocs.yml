site_name: Motherplant Archives | BarrelStorm
site_description: Officially approved documentation of BarrelStorm
site_url: https://karl5252.github.io/BarrelStormWiki/
repo_url: https://github.com/karl5252/BarrelStormWiki
repo_name: karl5252/BarrelStormWiki
copyright: "Ministry of Public Clarity · For the Motherplant"
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: Roboto
    code: Roboto Mono
extra_css:
  - assets/css/motherplant.css
  - assets/css/propaganda-gallery.css
extra_javascript:
  - assets/js/bulletin.js
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
nav:
  - Terminal: index.md
  - Game Design:
      - Vision: vision.md
      - Core Gameplay: gameplay.md
      - Enemy Forces: enemies.md
      - Armored Vehicle Catalogue: armored-vehicle-catalogue.md
      - Art Direction: art-direction.md
  - Motherplant Archives:
      - World & Tone: world-and-tone.md
      - The Doctrine: motherplant-doctrine.md
      - The Mothercore: the-mothercore.md
      - The Great Network: the-great-network.md
      - Ministries: ministries.md
      - Chronology: chronology.md
      - Muhosransk Incident: muhosransk-incident.md
      - Recovered Transmissions: recovered-transmissions.md
      - Roots & Settlements: rootborn-settlements.md
      - Severed Branches: severed-branches.md
      - Sacred CORE Ledger: core-recovery-ledger.md
      - The Unmapped Network: cartography-of-the-unknown.md
  - Citizen Services:
      - The Little Red Handbook: citizens-handbook.md
      - Civil Defense Manual: civil-defense-manual.md
      - Everyday Life: everyday-life.md
      - Calendar of Gratitude: rites-and-festivals.md
      - Lessons for Little Citizens: lessons-for-little-citizens.md
      - Voices of the People: oral-histories.md
      - Tanker Field Manual: tanker-field-manual.md
  - Ministry Circulars:
      - Reprocessing Directives: reprocessing-directives.md
      - Official Bulletins: ministries-bulletins.md
      - Surface Dispatches: military-communiques.md
      - Reprocessing Case Files: reprocessing-case-files.md
  - Ministry of Culture:
      - Propaganda Gallery: gallery.md
